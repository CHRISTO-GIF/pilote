# Installation et mise à jour de Pilote — aucun ordinateur nécessaire.
# Seul secret obligatoire : SUPABASE_ACCESS_TOKEN. Facultatif : ANTHROPIC_API_KEY (rédaction par l'IA).
name: Déployer Pilote

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pilote
  cancel-in-progress: false

jobs:
  server:
    name: Serveur (Supabase)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.setup.outputs.url }}
      anon: ${{ steps.setup.outputs.anon }}
    steps:
      - uses: actions/checkout@v4
      - name: Jeton Supabase présent ?
        id: has
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::Ajoutez le secret SUPABASE_ACCESS_TOKEN pour installer le serveur. Motion est mis en ligne quand même."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.has.outputs.ok == 'true'
        with:
          version: latest
      - name: Installer / mettre à jour
        id: setup
        if: steps.has.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/supabase-setup.sh

  site:
    name: Sites (tableau de bord + Motion)
    needs: server
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Construire
        env:
          VITE_SUPABASE_URL: ${{ needs.server.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ needs.server.outputs.anon }}
          VITE_TIMEZONE: Africa/Ndjamena
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          export VITE_MOTION_URL="$BASE/motion/"
          export VITE_PILOTE_URL="$BASE/"
          (cd motion && npm install --no-audit --no-fund && npm run build)
          mkdir -p site/motion
          cp -r motion/dist/. site/motion/
          if [ -n "$VITE_SUPABASE_URL" ]; then
            (cd dashboard && npm install --no-audit --no-fund && npm run build)
            cp -r dashboard/dist/. site/
          else
            cp scripts/attente.html site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
